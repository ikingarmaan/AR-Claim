<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/rcmclaim-logo.png" />
    <link rel="apple-touch-icon" href="/rcmclaim-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RCMclaim — US Healthcare Revenue Cycle Management Academy</title>
    <meta name="description" content="RCMclaim: Master the 10-stage US Healthcare Revenue Cycle from Appointment Scheduling through AR Follow-Up. Interactive CMS-1500 & UB-04 claim forms, coding, denials, and certification exams." />
    <!-- Theme Bootstrap: Syncs saved theme or prefers-color-scheme smoothly -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('rcmclaim_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="skeuo-linen text-stone-800 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
